# .github/workflows/keep-alive.yml
name: Keep Render backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 30 https://api.wordtabernacle.org.ng/api/health \
            || echo "Ping failed or backend was cold — next scheduled run will retry"